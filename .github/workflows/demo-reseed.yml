# Resets and reseeds the HOSTED DEMO Supabase project on a schedule.
#
# `supabase db reset --linked` wipes every table in the linked project and
# replays the migrations + supabase/seed.sql from scratch — it is destructive.
# SUPABASE_DEMO_PROJECT_REF must always point at the demo project, never at a
# real customer project. Double-check the ref in repo secrets before changing it.
name: Reseed hosted demo

on:
  schedule:
    # Nightly, 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  reseed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        run: |
          if [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] && [ -n "${{ secrets.SUPABASE_DEMO_PROJECT_REF }}" ] && [ -n "${{ secrets.SUPABASE_DEMO_DB_PASSWORD }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — SUPABASE_ACCESS_TOKEN, SUPABASE_DEMO_PROJECT_REF and/or SUPABASE_DEMO_DB_PASSWORD are not set."
          fi

      - name: Set up bun
        if: steps.check.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        if: steps.check.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Keep in step with the local CLI: config.toml uses sections older CLIs reject (e.g. [local_smtp]).
          version: 2.118.0

      - name: Link the demo project
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_DEMO_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DEMO_DB_PASSWORD }}"

      - name: Reset and reseed the linked (demo) database
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db reset --linked

      - name: Upload seed media
        if: steps.check.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_DEMO_PROJECT_REF }}
        run: |
          key=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal --output json \
            | jq -r '[.[] | select(.name == "service_role" or .type == "secret")][0].api_key')
          SUPABASE_URL="https://${SUPABASE_PROJECT_REF}.supabase.co" SUPABASE_SERVICE_ROLE_KEY="$key" \
            node supabase/scripts/upload-seed-media.mjs
